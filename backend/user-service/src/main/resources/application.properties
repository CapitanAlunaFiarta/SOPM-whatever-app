server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres-db:5432/whatever_db}
spring.datasource.username=${DB_USER:whatever_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:30000}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
app.admin-email=${ADMIN_EMAIL}
app.admin-password=${ADMIN_PASSWORD}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
app.public-url=${PUBLIC_URL:http://localhost:5173}
app.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
app.webauthn.origin=${WEBAUTHN_ORIGIN:http://localhost:5173}
