server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.main.banner-mode=off

# Baza de date (Supabase Session Pooler). Pool mic pentru planul gratuit.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/whatever_db}
spring.datasource.username=${DB_USER:whatever_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:600000}

# Autentificare
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-ttl-days=${JWT_REFRESH_DAYS:30}
app.timezone=${APP_TIMEZONE:Europe/Bucharest}

# CORS: originile exacte + modele (deploy preview-urile Netlify ale acestui site)
app.cors-origin=${CORS_ORIGIN:http://localhost:5173,http://localhost:8081,http://localhost:19006}
app.cors-origin-patterns=${CORS_ORIGIN_PATTERNS:https://*--whatever-unitbv.netlify.app}

# Administrator creat la prima pornire. Parola NU mai este rescrisă la fiecare pornire,
# decât dacă ADMIN_RESET_PASSWORD=true.
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
app.admin-username=${ADMIN_USERNAME:sebi_admin}
app.admin-reset-password=${ADMIN_RESET_PASSWORD:false}

# Email: MAIL_PROVIDER = brevo | resend | smtp | log
# Pe Render free porturile SMTP sunt blocate, deci în producție folosește brevo sau resend (HTTPS).
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.api-key=${MAIL_API_KEY:}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:Whatever}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.public-url=${PUBLIC_URL:http://localhost:5173}

# WebAuthn (passkey pe web)
app.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
app.webauthn.origin=${WEBAUTHN_ORIGIN:http://localhost:5173}

# Autentificarea e doar prin JWT; fără utilizatorul în memorie generat automat de Spring
# (altfel la fiecare pornire apare în log „Using generated security password”).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Versiuni noi ale aplicației (GitHub Releases): verificate periodic și anunțate în chatul comunității.
app.releases.enabled=${RELEASES_ENABLED:true}
app.releases.latest-url=${RELEASES_LATEST_URL:https://github.com/CapitanAlunaFiarta/SOPM-whatever-app/releases/latest}
app.releases.initial-delay-ms=${RELEASES_INITIAL_DELAY_MS:30000}
app.releases.poll-ms=${RELEASES_POLL_MS:900000}
# Notificări pe web (Web Push, fără Firebase). `sub` din semnătura VAPID: adresa site-ului (Apple cere https/mailto).
app.push.subject=${PUSH_SUBJECT:https://whatever-app-unitbv.me}
# Doar pentru teste: gazde în plus acceptate ca serviciu de push (ex. localhost în CI).
app.push.extra-hosts=${PUSH_EXTRA_HOSTS:}
