server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.main.banner-mode=off

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/whatever_db}
spring.datasource.username=${DB_USER:whatever_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:600000}

app.jwt.secret=${JWT_SECRET}
# Zilele (scadențe, streak) se calculează în ora României, nu în UTC.
app.timezone=${APP_TIMEZONE:Europe/Bucharest}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173,http://localhost:8081,http://localhost:19006}
app.cors-origin-patterns=${CORS_ORIGIN_PATTERNS:https://*--whatever-unitbv.netlify.app}
