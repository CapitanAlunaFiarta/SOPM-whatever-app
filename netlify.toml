# Site-ul web este aplicația Expo din client/ (același cod ca aplicațiile Android/iOS).
[build]
  base = "client"
  command = "npx expo export -p web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(self), camera=(self), publickey-credentials-get=(self), publickey-credentials-create=(self)"

# Fișierele generate de Expo au hash în nume, deci pot fi păstrate în cache oricât.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Aplicație cu o singură pagină: orice rută (/tasks, /reset?code=...) încarcă index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
